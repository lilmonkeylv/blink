name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.2.0
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - scripts/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - id: version
        run: |
          if [ "$PUBLISH" = "true" ]; then
            version=$(bun scripts/version.ts check "$TAG")
          else
            version=$(bun scripts/version.ts check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGNPATH: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Updater config
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'UPDATER_CONFIG={"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, building without updater artifacts"
            echo 'UPDATER_CONFIG={}' >> "$GITHUB_ENV"
          fi
      - name: Build
        if: env.SIGNPATH != 'true'
        shell: bash
        run: bun tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$UPDATER_CONFIG"

      - name: Build blink.exe
        if: env.SIGNPATH == 'true'
        shell: bash
        run: bun tauri build --ci --target ${{ matrix.target }} --no-bundle
      - id: unsigned-exe
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/${{ matrix.target }}/release/blink.exe
          if-no-files-found: error
      - name: Sign blink.exe
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'blink' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
      - name: Bundle installers
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          cp signed-exe/blink.exe target/${{ matrix.target }}/release/blink.exe
          bun tauri bundle --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$UPDATER_CONFIG"
      - id: unsigned-installers
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          if-no-files-found: error
          path: |
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
            ${{ env.BUNDLE_DIR }}/msi/*.msi
      - name: Sign installers
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'blink' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers
      - name: Re-sign updater bundles
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          cp -r signed-installers/. "$BUNDLE_DIR/"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for f in "$BUNDLE_DIR"/nsis/*.exe "$BUNDLE_DIR"/msi/*.msi; do
              rm -f "$f.sig"
              bun tauri signer sign --app-version "${{ needs.prepare.outputs.version }}" "$f"
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/*/*.sig

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      BLINK_LOG: info
      SMOKE_SECONDS: "20"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: dist
      - name: Launch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Blink/blink.exe'
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Depth 3 -Filter blink.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $exe) { throw 'blink.exe not found after install' }
          Write-Host "installed at $exe"
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds $env:SMOKE_SECONDS
          if ($app.HasExited) { throw "Blink exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $log = Join-Path $env:LOCALAPPDATA 'Blink/data/logs/blink.log'
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern ' ERROR ' -Quiet)) { Get-Content $log; throw 'errors in blink.log' }
          $uninstaller = Join-Path (Split-Path $exe) 'uninstall.exe'
          if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait }
      - name: Launch on macOS
        if: runner.os == 'macOS'
        run: |
          dmg=$(find dist -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/blink
          /Volumes/blink/Blink.app/Contents/MacOS/blink &
          pid=$!
          sleep "$SMOKE_SECONDS"
          kill -0 "$pid" || { echo "Blink exited early"; exit 1; }
          kill "$pid"
          hdiutil detach /Volumes/blink
          log="$HOME/Library/Application Support/Blink/logs/blink.log"
          if [ -f "$log" ] && grep -q ' ERROR ' "$log"; then cat "$log"; exit 1; fi
      - name: Launch on Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          deb=$(find dist -name '*.deb' | head -1)
          dpkg-deb -f "$deb" Depends | grep -qw git || { echo "deb does not depend on git"; exit 1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards './usr/share/applications/*.desktop' | grep -q 'x-scheme-handler/blink' || { echo "desktop entry is missing the blink:// handler"; exit 1; }
          appimage=$(find dist -name '*.AppImage' | head -1)
          chmod +x "$appimage"
          set +e
          timeout "$SMOKE_SECONDS" xvfb-run -a "$appimage"
          code=$?
          set -e
          [ "$code" -eq 124 ] || { echo "Blink exited early with code $code"; exit 1; }
          log="$HOME/.local/share/blink/logs/blink.log"
          if [ -f "$log" ] && grep -q ' ERROR ' "$log"; then cat "$log"; exit 1; fi

  publish:
    needs: [prepare, build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Release notes
        run: bunx git-cliff --latest --strip all > notes.md && cat notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: bun scripts/updater-manifest.ts dist "${{ needs.prepare.outputs.version }}" "$TAG" notes.md dist/latest.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          find dist -type f | sort
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=(--draft --title "Blink $VERSION" --notes-file notes.md)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" --verify-tag
          fi
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
