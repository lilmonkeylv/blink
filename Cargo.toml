[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "benches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lilmonkeylv/blink"
rust-version = "1.88"

[workspace.dependencies]
blink-core = { path = "crates/blink-core" }
blink-git = { path = "crates/blink-git" }
blink-diff = { path = "crates/blink-diff" }
blink-github = { path = "crates/blink-github" }
blink-store = { path = "crates/blink-store" }
blink-watch = { path = "crates/blink-watch" }

arc-swap = "1.9"
base64 = "0.23"
crossbeam-channel = "0.5"
dashmap = "6.2"
directories = "6"
gix = { version = "0.89", default-features = false, features = ["sha1", "max-performance-safe", "status", "revision", "index", "dirwalk", "blob-diff", "parallel"] }
imara-diff = "0.2"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
keyring = "3"
notify-debouncer-full = "0.7"
parking_lot = "0.12"
rand = "0.9"
rayon = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
toml = "0.9"
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
